# ---------------------------------------------------------------------------
# Servidor nginx para el frontend estático de la Librería.
# Se copia a /etc/nginx/conf.d/default.conf (reemplaza la config por defecto).
# ---------------------------------------------------------------------------
server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # No expone la versión de nginx en las respuestas ni en las páginas de error.
    server_tokens off;

    # Los archivos fuente están en UTF-8: se declara para tildes y ñ.
    charset utf-8;

    # Sin listados de directorio: si falta un archivo se responde 404.
    autoindex off;

    # ------------------------------- Compresión -------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # --------------------------------- Caché ----------------------------------
    # Sitio chico que se redespliega seguido y se revisa durante el parcial:
    # se prefiere contenido siempre fresco (no-cache = revalida, no prohíbe cachear).
    add_header Cache-Control "no-cache" always;

    # --------------------------- Cabeceras de seguridad -----------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # CSP: se deja comentada a propósito. El proyecto prohíbe scripts y estilos
    # externos, pero si algún módulo usa atributos style="..." o manejadores
    # onclick="...", una CSP estricta rompería la página sin aviso.
    # Para activarla, verificar primero que todo el JS/CSS sea externo y usar:
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'self'; frame-ancestors 'self'" always;

    # -------------------------------- Rutas -----------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Bloquea archivos ocultos (.git, .env, etc.) salvo los desafíos ACME.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
