# Despliegue automático a la VPS (EasyPanel) al hacer push a main.
#
# 1) Job "build": construye la imagen y la arranca para verificar que el sitio
#    responde. Si el Dockerfile o nginx.conf se rompen, el deploy no sale.
# 2) Job "deploy": dispara el webhook de la app en EasyPanel, que baja el
#    commit nuevo y reconstruye el contenedor en la VPS.
#
# Secret requerido (Settings > Secrets and variables > Actions):
#   EASYPANEL_DEPLOY_WEBHOOK -> URL del webhook de deploy de la app en EasyPanel
#   (App > General/Deploy > "Deploy Webhook", es una URL con token).
name: Deploy a la VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un deploy a la vez: si llegan dos push seguidos, no se pisan.
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Verificar imagen Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen (sin publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: parcial1-prog3-libreria:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (el sitio tiene que responder)
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 8080:80 parcial1-prog3-libreria:ci
          listo=0
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8080/ | grep -qi "librer"; then
              echo "OK: nginx sirve index.html"
              listo=1
              break
            fi
            sleep 2
          done
          if [ "$listo" -ne 1 ]; then
            echo "::error::El contenedor no devolvió el sitio"
            docker logs smoke || true
            exit 1
          fi
          # Cada asset local que referencia index.html tiene que servir 200.
          for ruta in \
            /css/style.css \
            /css/tema.css \
            /js/nucleo/data.js \
            /js/modulos/catalogo.js \
            /js/nucleo/navegacion.js \
            /js/modulos/libros.js \
            /js/modulos/clientes.js \
            /js/modulos/ventas.js \
            /js/modulos/historial.js \
            /js/nucleo/storage.js \
            /js/modulos/tema.js
          do
            if ! curl -fsS -o /dev/null "http://localhost:8080${ruta}"; then
              echo "::error::No se pudo cargar el asset ${ruta}"
              docker logs smoke || true
              exit 1
            fi
            echo "OK: ${ruta}"
          done
          echo "OK: los 11 assets responden"

      - name: El smoke test cubre todos los assets locales de index.html
        run: |
          set -euo pipefail
          esperado="/css/style.css /css/tema.css /js/modulos/catalogo.js /js/modulos/clientes.js /js/modulos/historial.js /js/modulos/libros.js /js/modulos/tema.js /js/modulos/ventas.js /js/nucleo/data.js /js/nucleo/navegacion.js /js/nucleo/storage.js"
          reales=$(grep -oE '(href|src)="[^"]+"' index.html \
            | sed -E 's/^(href|src)="//; s/"$//' \
            | grep -vE '^(https?:|#|mailto:|data:)' \
            | sed 's|^|/|' \
            | sort -u | tr '\n' ' ' | sed 's/[[:space:]]*$//')
          if [ "$reales" != "$esperado" ]; then
            echo "::error::La lista de assets del smoke test no coincide con index.html"
            echo "esperado: $esperado"
            echo "real:     $reales"
            exit 1
          fi
          echo "OK: la lista de assets del smoke test coincide con index.html"

      - name: Limpiar contenedor de prueba
        if: always()
        run: docker rm -f smoke || true

  deploy:
    name: Desplegar en EasyPanel
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Disparar webhook de EasyPanel
        env:
          WEBHOOK: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK:-}" ]; then
            echo "::error::Falta el secret EASYPANEL_DEPLOY_WEBHOOK (ver README de despliegue)"
            exit 1
          fi
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/resp -w '%{http_code}' -X POST "$WEBHOOK") || code=000
            echo "Intento $i -> HTTP $code"
            cat /tmp/resp 2>/dev/null || true
            echo ""
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              echo "Deploy disparado en EasyPanel"
              exit 0
            fi
            sleep 10
          done
          echo "::error::EasyPanel rechazó el deploy (revisar el webhook y los logs de la app)"
          exit 1
